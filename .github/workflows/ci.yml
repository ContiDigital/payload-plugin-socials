name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-matrix:
    name: Database boot (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          - database: mongodb
            image: mongo:8@sha256:b8806ee8207318a30316eca72257da4c146025a80fdcdb4c597e596af9233ee3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start ${{ matrix.database }} with registry retries
        env:
          DATABASE: ${{ matrix.database }}
          DATABASE_IMAGE: ${{ matrix.image }}
        run: bash ./scripts/ci/start-database.sh "$DATABASE" "$DATABASE_IMAGE"
      - run: pnpm exec vitest --run src/__tests__/boot.test.ts
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/socials_test
          POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/socials_test
          SOCIALS_TEST_DATABASE: ${{ matrix.database }}
      - name: Stop ${{ matrix.database }}
        if: always()
        env:
          DATABASE: ${{ matrix.database }}
        run: docker rm --force "payload-socials-${DATABASE}" >/dev/null 2>&1 || true

  release-check:
    name: Release check (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit all dependencies
        run: pnpm audit:all
      - run: pnpm release:check
      - if: matrix.node == '24'
        run: pnpm exec playwright install --with-deps
      - if: matrix.node == '24'
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_ARTIFACTS_DIR: ${{ runner.temp }}/payload-plugin-socials-playwright
      - name: Retain Playwright diagnostics
        if: failure() && matrix.node == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/payload-plugin-socials-playwright/playwright-report/
            ${{ runner.temp }}/payload-plugin-socials-playwright/test-results/
          if-no-files-found: warn
          retention-days: 14
