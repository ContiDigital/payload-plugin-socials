name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read # CodeQL reads run metadata for incremental analysis
      contents: read
      security-events: write # CodeQL uploads SARIF results
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
      - id: codeql-analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          upload: ${{ (github.event.repository.visibility == 'public' || vars.CODEQL_UPLOAD_RESULTS == 'true') && 'always' || 'never' }}
          upload-database: ${{ github.event.repository.visibility == 'public' || vars.CODEQL_UPLOAD_RESULTS == 'true' }}
      - name: Retain SARIF when GitHub Code Scanning is unavailable
        if: github.event.repository.visibility != 'public' && vars.CODEQL_UPLOAD_RESULTS != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: ${{ steps.codeql-analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 14
