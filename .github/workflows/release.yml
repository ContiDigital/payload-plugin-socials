name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing exchanges this OIDC token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.0.1 # zizmor: ignore[adhoc-packages] exact npm version required for trusted publishing
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node --input-type=module -e
          "import pkg from './package.json' with { type: 'json' };
          if (process.env.RELEASE_TAG !== 'v' + pkg.version) {
            throw new Error('Release tag must be v' + pkg.version)
          }"
      - run: pnpm release:check
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
      - run: npm publish --access public
